[tool:pytest]
testpaths = src/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --durations=10
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may be slower)
    slow: Slow tests (skip in CI if needed)
    chaos: Chaos mode testing
    risk: Risk management tests
    performance: Performance benchmarks
    destructive: Tests that modify state
    prop_firm: Prop firm quality validation tests
